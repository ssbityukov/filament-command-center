version: 2

updates:
  # Actions are the only ecosystem with anything for an updater to maintain.
  # composer.lock is not committed — the test matrix resolves dependencies fresh
  # on every run, so a lockfile updater would have no lockfile to move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release sit long enough for the community to spot a compromised
    # or broken publish before it lands in a PR here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
